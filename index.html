<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090711">
<title>TOM chat</title>

<style>
:root {
  --bg:#090711;
  --panel:#151221;
  --panel2:#211a32;
  --purple:#9b6dff;
  --purple2:#7544db;
  --text:#f6f2ff;
  --muted:#aaa1bd;
  --border:#332944;
  --danger:#ff647c;
  --green:#58d6a1;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Tahoma,sans-serif;
  min-height:100vh;
}
button,input { font:inherit; }
button {
  border:0;
  cursor:pointer;
  border-radius:12px;
  padding:11px 14px;
  background:var(--purple);
  color:white;
  font-weight:bold;
}
button:disabled { opacity:.5; cursor:not-allowed; }
button.secondary { background:var(--panel2); border:1px solid var(--border); }
button.danger { background:#562130; }
button.green { background:#176c50; }
input {
  width:100%;
  padding:13px;
  color:white;
  background:#0e0b18;
  border:1px solid var(--border);
  border-radius:12px;
  outline:none;
}
input:focus { border-color:var(--purple); }
.hidden { display:none !important; }
header {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:16px;
  border-bottom:1px solid var(--border);
  background:#100d1b;
  position:sticky;
  top:0;
  z-index:5;
}
.logo { font-size:23px; font-weight:900; letter-spacing:.5px; }
.logo span { color:var(--purple); }
.container { width:min(100%,1000px); margin:auto; padding:16px; }
.panel {
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:18px;
  padding:16px;
  margin-bottom:15px;
}
h2,h3 { margin-top:0; }
.muted { color:var(--muted); font-size:13px; line-height:1.7; }
.form { display:grid; gap:11px; }
.actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
.tabs { display:flex; gap:8px; overflow-x:auto; margin-bottom:15px; }
.tabs button { white-space:nowrap; }
.tabs button.active { background:var(--purple2); }
.item {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--border);
}
.item:last-child { border-bottom:0; }
.item-name { font-weight:bold; overflow-wrap:anywhere; }
.item-sub { color:var(--muted); font-size:12px; margin-top:5px; }
.item-actions { display:flex; gap:6px; flex-wrap:wrap; }
.item-actions button { padding:9px 10px; font-size:12px; }
#chatBox {
  display:flex;
  flex-direction:column;
  height:min(58vh,570px);
  min-height:280px;
}
#chatMessages {
  flex:1;
  overflow-y:auto;
  padding:10px 0;
}
.message {
  width:fit-content;
  max-width:85%;
  background:var(--panel2);
  border:1px solid var(--border);
  border-radius:15px;
  padding:10px 12px;
  margin:8px 0;
  overflow-wrap:anywhere;
}
.message.mine {
  margin-right:auto;
  background:#38245f;
  border-color:#6842a0;
}
.message-name { color:#d5bfff; font-size:12px; margin-bottom:6px; }
.message-time { color:#c3b8d8; font-size:10px; margin-top:6px; }
#sendForm { display:flex; gap:8px; }
#sendForm input { flex:1; min-width:0; }
#status { margin-bottom:12px; color:var(--muted); font-size:13px; }
#status.error { color:var(--danger); }
#authPanel { max-width:470px; margin:35px auto; }
.empty { color:var(--muted); text-align:center; padding:20px 5px; }
@media(min-width:760px) {
  .layout { display:grid; grid-template-columns:1fr 1fr; gap:15px; }
  .layout .panel { margin-bottom:0; }
}
</style>
</head>

<body>
<header>
  <div class="logo">TOM <span>chat</span></div>
  <div id="headerUser" class="muted">دردشة تجمعنا 💜</div>
  <button id="logoutBtn" class="secondary hidden">خروج</button>
</header>

<main class="container">
  <div id="status">جاري الاتصال...</div>

  <section id="authPanel" class="panel">
    <h2>أهلاً بك في TOM chat 💜</h2>
    <p class="muted">سجّل الدخول أو أنشئ حساباً جديداً.</p>

    <form id="authForm" class="form">
      <input id="usernameInput" placeholder="اسم المستخدم (للحساب الجديد)"
        autocomplete="username" maxlength="24">
      <input id="emailInput" type="email" placeholder="البريد الإلكتروني"
        autocomplete="email" required>
      <input id="passwordInput" type="password" placeholder="كلمة المرور"
        autocomplete="current-password" minlength="6" required>

      <button id="loginBtn" type="submit">تسجيل الدخول</button>
      <button id="signupBtn" type="button" class="secondary">إنشاء حساب جديد</button>
      <button id="resetBtn" type="button" class="secondary">نسيت كلمة المرور؟</button>
    </form>
  </section>

  <section id="appPanel" class="hidden">
    <div class="tabs">
      <button class="active" data-tab="people">البحث عن الأصدقاء</button>
      <button data-tab="requests">طلبات الصداقة</button>
      <button data-tab="friends">أصدقائي</button>
    </div>

    <section id="peopleTab" class="panel">
      <h2>البحث عن مستخدم</h2>
      <p class="muted">اكتب اسم المستخدم كما يظهر في حسابه.</p>
      <form id="searchForm" class="form">
        <input id="searchInput" placeholder="اسم المستخدم" maxlength="24" required>
        <button type="submit">بحث</button>
      </form>
      <div id="searchResults"></div>
    </section>

    <section id="requestsTab" class="panel hidden">
      <h2>طلبات الصداقة الواردة</h2>
      <div id="incomingRequests"></div>
      <h3 style="margin-top:20px">الطلبات المرسلة</h3>
      <div id="outgoingRequests"></div>
    </section>

    <section id="friendsTab" class="panel hidden">
      <h2>أصدقائي</h2>
      <div id="friendsList"></div>
    </section>

    <section id="chatPanel" class="panel hidden">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
        <div>
          <h2 id="chatTitle" style="margin-bottom:4px">المحادثة</h2>
          <div class="muted">محادثة خاصة بين الأصدقاء</div>
        </div>
        <button id="closeChatBtn" class="secondary">إغلاق</button>
      </div>

      <div id="chatBox">
        <div id="chatMessages"></div>
        <form id="sendForm">
          <input id="messageInput" placeholder="اكتب رسالتك..." maxlength="2000"
            autocomplete="off" required>
          <button id="sendBtn" type="submit">إرسال</button>
        </form>
      </div>
    </section>
  </section>
</main>

<script type="module">
import { initializeApp } from
  "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  sendPasswordResetEmail, signOut, onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
  getFirestore, collection, doc, getDoc, getDocs, setDoc,
  addDoc, updateDoc, query, where, orderBy, limit,
  onSnapshot, serverTimestamp, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCrRxm1YvDQ6OkImMn5yvXc-VtMqS804E8",
  authDomain: "tom-chat-c2412.firebaseapp.com",
  projectId: "tom-chat-c2412",
  storageBucket: "tom-chat-c2412.firebasestorage.app",
  messagingSenderId: "627903451599",
  appId: "1:627903451599:web:c0f8b80372637401e002ba",
  measurementId: "G-C3RTB7NC07"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
let currentUser = null;
let currentProfile = null;
let currentChatId = null;
let currentFriend = null;
let stopListeners = [];
let messageListener = null;
let busy = false;

function status(message, error = false) {
  $("status").textContent = message;
  $("status").classList.toggle("error", error);
}
function cleanError(error) {
  const code = error?.code || "";
  const messages = {
    "auth/invalid-email": "البريد الإلكتروني غير صحيح.",
    "auth/email-already-in-use": "هذا البريد مسجل من قبل.",
    "auth/weak-password": "اختر كلمة مرور أقوى، من 6 أحرف على الأقل.",
    "auth/invalid-credential": "البريد أو كلمة المرور غير صحيحة.",
    "auth/network-request-failed": "تحقق من اتصال الإنترنت.",
    "permission-denied": "تم رفض العملية بسبب صلاحيات قاعدة البيانات.",
    "failed-precondition": "قد تحتاج قاعدة البيانات إلى فهرس إضافي."
  };
  return messages[code] || error?.message || "حدث خطأ غير متوقع.";
}
function safeText(value) {
  return String(value ?? "");
}
function make(tag, className, text) {
  const el = document.createElement(tag);
  if (className) el.className = className;
  if (text !== undefined) el.textContent = text;
  return el;
}
function showEmpty(container, text) {
  container.replaceChildren(make("div", "empty", text));
}
function pairId(a, b) {
  return [a, b].sort().join("_");
}
function addListener(unsubscribe) {
  stopListeners.push(unsubscribe);
}
function stopAll() {
  stopListeners.forEach(fn => fn());
  stopListeners = [];
  if (messageListener) messageListener();
  messageListener = null;
}
function setTab(name) {
  ["people", "requests", "friends"].forEach(tab => {
    $(tab + "Tab").classList.toggle("hidden", tab !== name);
    document.querySelector(`[data-tab="${tab}"]`)
      ?.classList.toggle("active", tab === name);
  });
}
document.querySelectorAll("[data-tab]").forEach(button => {
  button.addEventListener("click", () => setTab(button.dataset.tab));
});

function makeItem(name, subtitle) {
  const row = make("div", "item");
  const info = make("div");
  info.append(make("div", "item-name", name));
  info.append(make("div", "item-sub", subtitle || ""));
  const actions = make("div", "item-actions");
  row.append(info, actions);
  return { row, actions };
}

$("authForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (busy) return;
  busy = true;
  $("loginBtn").disabled = true;
  try {
    await signInWithEmailAndPassword(
      auth, $("emailInput").value.trim(), $("passwordInput").value
    );
    status("تم تسجيل الدخول 💜");
  } catch (e) {
    status(cleanError(e), true);
  } finally {
    busy = false;
    $("loginBtn").disabled = false;
  }
});

$("signupBtn").addEventListener("click", async () => {
  if (busy) return;
  const username = $("usernameInput").value.trim();
  const email = $("emailInput").value.trim();
  const password = $("passwordInput").value;

  if (!/^[a-zA-Z0-9_]{3,24}$/.test(username)) {
    status("اسم المستخدم يجب أن يكون من 3 إلى 24 حرفاً إنجليزياً أو رقماً أو _.", true);
    return;
  }
  if (!email || password.length < 6) {
    status("أدخل البريد الإلكتروني وكلمة مرور من 6 أحرف على الأقل.", true);
    return;
  }

  busy = true;
  $("signupBtn").disabled = true;
  try {
    const lower = username.toLowerCase();
    const existing = await getDocs(query(
      collection(db, "users"),
      where("usernameLower", "==", lower),
      limit(1)
    ));
    if (!existing.empty) {
      status("اسم المستخدم مستخدم بالفعل. اختر اسماً آخر.", true);
      return;
    }

    const credential = await createUserWithEmailAndPassword(auth, email, password);
    await setDoc(doc(db, "users", credential.user.uid), {
      uid: credential.user.uid,
      username,
      usernameLower: lower,
      createdAt: serverTimestamp()
    });
    status("تم إنشاء حسابك بنجاح 💜");
  } catch (e) {
    status(cleanError(e), true);
  } finally {
    busy = false;
    $("signupBtn").disabled = false;
  }
});

$("resetBtn").addEventListener("click", async () => {
  const email = $("emailInput").value.trim();
  if (!email) {
    status("اكتب بريدك الإلكتروني أولاً.", true);
    return;
  }
  try {
    await sendPasswordResetEmail(auth, email);
    status("إذا كان البريد مسجلاً، ستصلك رسالة استعادة كلمة المرور.");
  } catch (e) {
    status(cleanError(e), true);
  }
});

$("logoutBtn").addEventListener("click", async () => {
  try {
    await signOut(auth);
    status("تم تسجيل الخروج.");
  } catch (e) {
    status(cleanError(e), true);
  }
});

onAuthStateChanged(auth, async user => {
  stopAll();
  currentUser = user;
  currentProfile = null;
  currentChatId = null;
  currentFriend = null;
  $("chatPanel").classList.add("hidden");
  $("chatMessages").replaceChildren();

  $("authPanel").classList.toggle("hidden", !!user);
  $("appPanel").classList.toggle("hidden", !user);
  $("logoutBtn").classList.toggle("hidden", !user);

  if (!user) {
    $("headerUser").textContent = "دردشة تجمعنا 💜";
    return;
  }

  try {
    const profileSnap = await getDoc(doc(db, "users", user.uid));
    if (!profileSnap.exists()) {
      status("لم يتم العثور على ملف المستخدم. سجّل الخروج ثم حاول مجدداً.", true);
      return;
    }

    currentProfile = profileSnap.data();
    $("headerUser").textContent = "أهلاً " + currentProfile.username;
    status("أهلاً بك في TOM chat 💜");
    listenRequests();
    listenFriends();
  } catch (e) {
    status(cleanError(e), true);
  }
});

$("searchForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (!currentUser) return;
  const term = $("searchInput").value.trim().toLowerCase();
  if (term.length < 3) {
    status("اكتب 3 أحرف على الأقل للبحث.", true);
    return;
  }

  const results = $("searchResults");
  showEmpty(results, "جاري البحث...");
  try {
    const snapshot = await getDocs(query(
      collection(db, "users"),
      where("usernameLower", ">=", term),
      where("usernameLower", "<=", term + "\uf8ff"),
      limit(20)
    ));
    results.replaceChildren();
    let count = 0;

    for (const userDoc of snapshot.docs) {
      const person = userDoc.data();
      if (person.uid === currentUser.uid) continue;
      count++;

      const item = makeItem(person.username, "@" + person.usernameLower);
      const addBtn = make("button", "", "إضافة");
      addBtn.addEventListener("click", () => sendRequest(person.uid, addBtn));
      item.actions.append(addBtn);
      results.append(item.row);
    }
    if (!count) showEmpty(results, "لم نعثر على مستخدم بهذا الاسم.");
  } catch (e) {
    showEmpty(results, cleanError(e));
    status(cleanError(e), true);
  }
});

async function sendRequest(toUid, button) {
  if (!currentUser || toUid === currentUser.uid) return;
  button.disabled = true;
  try {
    const friendshipId = pairId(currentUser.uid, toUid);
    const friendshipSnap = await getDoc(doc(db, "friendships", friendshipId));
    if (friendshipSnap.exists()) {
      status("أنتم أصدقاء بالفعل.");
      return;
    }

    const existing = await getDocs(query(
      collection(db, "friendRequests"),
      where("fromUid", "==", currentUser.uid),
      where("toUid", "==", toUid),
      limit(1)
    ));
    if (!existing.empty) {
      const requestData = existing.docs[0].data();
      status(requestData.status === "pending"
        ? "أرسلت طلب صداقة من قبل."
        : "يوجد طلب سابق بينكما. لا يمكن إعادة إرساله بهذه النسخة.");
      return;
    }

    await addDoc(collection(db, "friendRequests"), {
      fromUid: currentUser.uid,
      toUid,
      status: "pending",
      createdAt: serverTimestamp()
    });
    status("تم إرسال طلب الصداقة 💜");
    button.textContent = "تم الإرسال";
  } catch (e) {
    status(cleanError(e), true);
  } finally {
    button.disabled = false;
  }
}

function listenRequests() {
  addListener(onSnapshot(query(
    collection(db, "friendRequests"),
    where("toUid", "==", currentUser.uid)
  ), async snapshot => {
    const container = $("incomingRequests");
    container.replaceChildren();
    let count = 0;

    for (const requestDoc of snapshot.docs) {
      const data = requestDoc.data();
      if (data.status !== "pending") continue;
      count++;
      const profile = await getDoc(doc(db, "users", data.fromUid));
      const username = profile.exists()
        ? profile.data().username : "مستخدم";
      const item = makeItem(username, "طلب صداقة وارد");

      const accept = make("button", "green", "قبول");
      accept.addEventListener("click", () => acceptRequest(requestDoc.id, data));
      const decline = make("button", "danger", "رفض");
      decline.addEventListener("click", () => declineRequest(requestDoc.id));
      item.actions.append(accept, decline);
      container.append(item.row);
    }
    if (!count) showEmpty(container, "لا توجد طلبات واردة حالياً.");
  }, e => status(cleanError(e), true)));

  addListener(onSnapshot(query(
    collection(db, "friendRequests"),
    where("fromUid", "==", currentUser.uid)
  ), async snapshot => {
    const container = $("outgoingRequests");
    container.replaceChildren();
    let count = 0;

    for (const requestDoc of snapshot.docs) {
      const data = requestDoc.data();
      if (data.status !== "pending") continue;
      count++;
      const profile = await getDoc(doc(db, "users", data.toUid));
      const username = profile.exists()
        ? profile.data().username : "مستخدم";
      const item = makeItem(username, "بانتظار الرد");
      container.append(item.row);
    }
    if (!count) showEmpty(container, "لا توجد طلبات معلّقة.");
  }, e => status(cleanError(e), true)));
}

async function acceptRequest(requestId, requestData) {
  if (!currentUser || requestData.toUid !== currentUser.uid) return;
  try {
    const friendshipId = pairId(requestData.fromUid, requestData.toUid);
    const requestRef = doc(db, "friendRequests", requestId);
    const friendshipRef = doc(db, "friendships", friendshipId);

    await runTransaction(db, async tx => {
      const reqSnap = await tx.get(requestRef);
      const friendshipSnap = await tx.get(friendshipRef);

      if (!reqSnap.exists()
          || reqSnap.data().status !== "pending"
          || reqSnap.data().toUid !== currentUser.uid) {
        throw new Error("طلب الصداقة لم يعد متاحاً.");
      }
      if (friendshipSnap.exists()) {
        throw new Error("علاقة الصداقة موجودة بالفعل.");
      }

      tx.set(friendshipRef, {
        members: [requestData.fromUid, requestData.toUid].sort(),
        requestId,
        createdAt: serverTimestamp()
      });
      tx.update(requestRef, {
        status: "accepted",
        respondedAt: serverTimestamp()
      });
    });

    status("تم قبول طلب الصداقة بنجاح 💜");
  } catch (e) {
    status(cleanError(e), true);
  }
}

async function declineRequest(requestId) {
  try {
    const requestRef = doc(db, "friendRequests", requestId);
    const snap = await getDoc(requestRef);
    if (!snap.exists()
        || snap.data().toUid !== currentUser.uid
        || snap.data().status !== "pending") {
      throw new Error("طلب الصداقة لم يعد متاحاً.");
    }
    await updateDoc(requestRef, {
      status: "declined",
      respondedAt: serverTimestamp()
    });
    status("تم رفض طلب الصداقة.");
  } catch (e) {
    status(cleanError(e), true);
  }
}

function listenFriends() {
  addListener(onSnapshot(query(
    collection(db, "friendships"),
    where("members", "array-contains", currentUser.uid)
  ), async snapshot => {
    const container = $("friendsList");
    container.replaceChildren();

    if (snapshot.empty) {
      showEmpty(container, "لم تضف أي أصدقاء بعد.");
      return;
    }

    for (const friendshipDoc of snapshot.docs) {
      const data = friendshipDoc.data();
      const friendUid = (data.members || []).find(uid => uid !== currentUser.uid);
      if (!friendUid) continue;

      const profileSnap = await getDoc(doc(db, "users", friendUid));
      const username = profileSnap.exists()
        ? profileSnap.data().username : "مستخدم";
      const item = makeItem(username, "صديق في TOM chat");
      const openBtn = make("button", "", "مراسلة");
      openBtn.addEventListener("click", () =>
        openChat(friendshipDoc.id, friendUid, username)
      );
      item.actions.append(openBtn);
      container.append(item.row);
    }
  }, e => status(cleanError(e), true)));
}

async function openChat(chatId, friendUid, username) {
  try {
    const friendshipSnap = await getDoc(doc(db, "friendships", chatId));
    if (!friendshipSnap.exists()
        || !friendshipSnap.data().members?.includes(currentUser.uid)
        || !friendshipSnap.data().members?.includes(friendUid)) {
      throw new Error("لا تملك صلاحية فتح هذه المحادثة.");
    }

    currentChatId = chatId;
    currentFriend = friendUid;
    $("chatTitle").textContent = "محادثة " + username;
    $("chatPanel").classList.remove("hidden");
    $("chatMessages").replaceChildren();
    $("messageInput").value = "";

    if (messageListener) messageListener();
    messageListener = onSnapshot(query(
      collection(db, "chats", chatId, "messages"),
      orderBy("createdAt", "asc"),
      limit(100)
    ), snapshot => {
      const container = $("chatMessages");
      container.replaceChildren();

      for (const messageDoc of snapshot.docs) {
        const data = messageDoc.data();
        const mine = data.uid === currentUser.uid;
        const bubble = make("div", "message" + (mine ? " mine" : ""));
        bubble.append(make("div", "message-name",
          mine ? "أنت" : safeText(data.name)));
        bubble.append(make("div", "", safeText(data.text)));

        if (data.createdAt?.toDate) {
          bubble.append(make("div", "message-time",
            data.createdAt.toDate().toLocaleString("ar")));
        }
        container.append(bubble);
      }
      container.scrollTop = container.scrollHeight;
    }, e => status(cleanError(e), true));

    $("chatPanel").scrollIntoView({ behavior: "smooth", block: "start" });
    status("أنت الآن في محادثة خاصة 💜");
  } catch (e) {
    status(cleanError(e), true);
  }
}

$("closeChatBtn").addEventListener("click", () => {
  if (messageListener) messageListener();
  messageListener = null;
  currentChatId = null;
  currentFriend = null;
  $("chatPanel").classList.add("hidden");
});

$("sendForm").addEventListener("submit", async event => {
  event.preventDefault();
  if (!currentUser || !currentChatId || !currentProfile) return;

  const text = $("messageInput").value.trim();
  if (!text || text.length > 2000) return;

  const chatId = currentChatId;
  $("sendBtn").disabled = true;

  try {
    const friendshipSnap = await getDoc(doc(db, "friendships", chatId));
    if (!friendshipSnap.exists()
        || !friendshipSnap.data().members?.includes(currentUser.uid)) {
      throw new Error("لم تعد لديك صلاحية إرسال الرسائل في هذه المحادثة.");
    }

    await addDoc(collection(db, "chats", chatId, "messages"), {
      uid: currentUser.uid,
      name: currentProfile.username,
      text,
      createdAt: serverTimestamp()
    });

    $("messageInput").value = "";
    $("messageInput").focus();
  } catch (e) {
    status(cleanError(e), true);
  } finally {
    $("sendBtn").disabled = false;
  }
});
</script>
</body>
</html>
